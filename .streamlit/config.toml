# Native Streamlit theme — Salasar brand, light base.
# Custom glassmorphism / layout is layered on top via app/utils/styles.py.
[theme]
base = "light"
primaryColor = "#2d448d"            # deep brand blue (widget accents, selection)
backgroundColor = "#f4f8fd"         # light app base (grid cells, inputs)
secondaryBackgroundColor = "#ffffff"
textColor = "#172962"               # navy text
font = "sans serif"
